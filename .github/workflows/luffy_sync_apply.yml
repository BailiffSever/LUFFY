name: LUFFY TODO Sync Apply
on:
  push:
    branches: [dev]
    paths:
      - '.luffy_sync/**'
      - '.github/workflows/luffy_sync_apply.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'LUFFY-SYNC-APPLIED') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full dev history
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply verified TODO patch, check result, clean transporters, push
        env:
          BASE_COMMIT: 7463fefd0f55ae2ba0b919e06527588022893495
          BASE_BLOB: ede832d1fcdfa1344615873c29eaccfbe3f99e96
          PATCH_BLOB: 8d7ddd57d8d9de29450167f8f5e3640c0171994b
          EXPECT_BLOB: 2d0e63fbb656bd00df4a9528b41bc09c1a925ddf
          EXPECT_SIZE: "27046"
          EXPECT_BULLETS: "215"
          PATCH_PATH: .luffy_sync/todo_sync.patch
          WORKFLOW_PATH: .github/workflows/luffy_sync_apply.yml
        run: |
          set -euo pipefail
          git config user.name "BailiffSever"
          git config user.email "pizzutipulkkinenvienna@gmail.com"

          patch_blob="$(git hash-object "$PATCH_PATH")"
          echo "patch_blob=$patch_blob"
          test "$patch_blob" = "$PATCH_BLOB"

          echo "Restore README.md from main-to-dev code commit"
          git checkout "$BASE_COMMIT" -- README.md
          base_blob="$(git hash-object README.md)"
          base_size="$(wc -c < README.md | tr -d ' ')"
          echo "base_blob=$base_blob base_size=$base_size"
          test "$base_blob" = "$BASE_BLOB"
          test "$base_size" = "28056"

          echo "Apply zero-context deterministic TODO patch"
          git apply --unidiff-zero --whitespace=nowarn "$PATCH_PATH"

          out_blob="$(git hash-object README.md)"
          out_size="$(wc -c < README.md | tr -d ' ')"
          out_bullets="$(grep -c '^- \[ \] \*\*' README.md || true)"
          echo "out_blob=$out_blob out_size=$out_size bullets=$out_bullets"
          test "$out_blob" = "$EXPECT_BLOB"
          test "$out_size" = "$EXPECT_SIZE"
          test "$out_bullets" = "$EXPECT_BULLETS"
          grep -Eq '^### .*Complete TODO List$' README.md

          echo "Remove temporary patch transport and this workflow"
          rm -rf .luffy_sync
          rm -f "$WORKFLOW_PATH"
          git add -A

          if git diff --cached --quiet; then
            echo "No staged changes after apply/cleanup; refusing empty success"
            exit 1
          fi

          git commit -m "docs(readme): sync Complete TODO List with dev implementation" -m "LUFFY-SYNC-APPLIED expected-blob=$EXPECT_BLOB bullets=$EXPECT_BULLETS"
          for attempt in 1 2 3; do
            if git push origin HEAD:dev; then
              echo "PUSHED_OK $EXPECT_BLOB"
              exit 0
            fi
            echo "push attempt $attempt failed; rebasing on origin/dev"
            git fetch origin dev
            git rebase origin/dev
          done
          echo "push failed after retries" >&2
          exit 1
